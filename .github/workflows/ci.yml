name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  planning-contract:
    name: Planning contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - uses: faustbrian/go-library-tools/.github/actions/setup-golib@09b43f49385650c44dd4151a12b0877ca6b48a88 # v2.5.1
        with:
          source_bootstrap: 'false'
      - name: Check selected module contract
        env:
          GOENV: 'off'
          GOWORK: 'off'
          GOTOOLCHAIN: local
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
          GOPRIVATE: ''
          GONOPROXY: ''
          GONOSUMDB: ''
        run: |
          set -euo pipefail
          task_root="$(mktemp -d "${RUNNER_TEMP}/oauth-contract.XXXXXX")"
          cleanup() {
            status=$?
            trap - EXIT HUP INT TERM
            chmod -R u+w "${task_root}" || status=1
            find "${task_root}" -depth -delete || status=1
            exit "${status}"
          }
          trap cleanup EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM
          mkdir "${task_root}/build" "${task_root}/modules" "${task_root}/tmp"
          export GOCACHE="${task_root}/build"
          export GOMODCACHE="${task_root}/modules"
          export GOTMPDIR="${task_root}/tmp"
          make ci

  required:
    name: Required
    if: always()
    needs: planning-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require planning contract
        env:
          PLANNING_RESULT: ${{ needs.planning-contract.result }}
        run: test "${PLANNING_RESULT}" = success
